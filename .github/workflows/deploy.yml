name: Build and Deploy

on:
  push:
    branches: [main, claude/protein-interaction-tool-4VJTp]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install marimo pandas pyarrow requests

      - name: Build interaction database
        run: python build_db.py
        continue-on-error: true

      - name: Export marimo app to WASM
        run: marimo export html-wasm app.py -o dist/ --mode run --no-show-code

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
